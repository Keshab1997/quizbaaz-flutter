name: quizbaaz
description: "🚀 QuizBaaz 3D - A Gamified Flutter Quiz & Learning Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  audioplayers: ^6.0.0
  confetti: ^0.7.0
  shared_preferences: ^2.2.3
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.8.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/questions/
    - assets/icons/
    - assets/images/
    - assets/images/characters/
    - assets/images/avatars/
